[mutmut]
# Teste de mutação (Aula 07 de Construção de Assistentes): o mutmut altera o código de propósito e
# confere se algum teste fica vermelho. Rodar: .venv/bin/mutmut run && .venv/bin/mutmut results
source_paths=
    copiloto/lote.py
    copiloto/tabela_oficial.py
    copiloto/enquadramento.py
pytest_add_cli_args_test_selection=
    tests/
also_copy=
    copiloto/__init__.py
    copiloto/nfe.py
    pytest.ini
    dados/
    exemplos/
